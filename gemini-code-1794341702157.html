<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal de Estudos - Português 8º Ano</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --space-blue: #0284c7;
      --space-light: #38bdf8;
      --text-main: #f8f9fa;
      --text-secondary: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      color: var(--text-main);
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.5;
      background-image:
        radial-gradient(2px 2px at 12% 18%, #ffffff, transparent),
        radial-gradient(1.5px 1.5px at 28% 72%, #ffffff, transparent),
        radial-gradient(2px 2px at 45% 25%, #ffffff, transparent),
        radial-gradient(1px 1px at 62% 84%, #ffffff, transparent),
        radial-gradient(2px 2px at 78% 15%, #ffffff, transparent),
        radial-gradient(1.5px 1.5px at 88% 58%, #ffffff, transparent),
        radial-gradient(1px 1px at 18% 48%, #ffffff, transparent),
        radial-gradient(2px 2px at 54% 62%, #ffffff, transparent),
        radial-gradient(1.5px 1.5px at 92% 30%, #ffffff, transparent),
        radial-gradient(1px 1px at 36% 90%, #ffffff, transparent);
      z-index: 0;
    }

    h1, h2, h3, .font-title { font-family: 'Fredoka', sans-serif; }

    .top-logo {
      position: relative;
      z-index: 1;
      max-width: 202px;
      width: 100%;
      height: auto;
      margin-bottom: 14px;
      filter: drop-shadow(0 6px 15px rgba(0, 0, 0, 0.7));
      -webkit-mask-image: radial-gradient(ellipse at center, black 48%, transparent 74%);
      mask-image: radial-gradient(ellipse at center, black 48%, transparent 74%);
    }

    .main-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 750px;
      height: 76vh;
      min-height: 480px;
      background: rgba(13, 27, 42, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 3px solid rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      padding: 24px 28px;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .main-card::-webkit-scrollbar { width: 8px; }
    .main-card::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); border-radius: 10px; }
    .main-card::-webkit-scrollbar-thumb { background: #0284c7; border-radius: 10px; }
    .main-card::-webkit-scrollbar-thumb:hover { background: #38bdf8; }

    .option-btn { transition: all 0.2s ease; }
    .option-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: #38bdf8;
      background-color: rgba(2, 132, 199, 0.2);
    }
  </style>
</head>
<body>

  <img src="judalogo.png" alt="Logo Judá" class="top-logo" />

  <main class="main-card flex flex-col justify-between">
    <!-- Cabeçalho -->
    <header class="border-b border-slate-700/80 pb-3 mb-4 flex flex-wrap items-center justify-between gap-2">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold text-[#38bdf8] tracking-wide">
          Português — 8º Ano
        </h1>
        <p id="header-subtitle" class="text-xs sm:text-sm text-[#94a3b8]">
          Guia Prático e Simulado Avaliativo
        </p>
      </div>
      <div id="quiz-badges" class="hidden flex items-center gap-2 flex-wrap">
        <span id="progress-badge" class="px-3 py-1 text-xs sm:text-sm font-bold rounded-full bg-[#0284c7]/30 border border-[#38bdf8] text-[#f8f9fa]">
          1 / 10
        </span>
        <span id="score-badge" class="px-3 py-1 text-xs sm:text-sm font-bold rounded-full bg-slate-800 border border-white/40 text-[#38bdf8]">
          Nota: 0.0 / 10
        </span>
      </div>
    </header>

    <!-- TELA 1: MENU PRINCIPAL -->
    <section id="menu-screen" class="flex-1 flex flex-col justify-between gap-4">
      <div class="space-y-3">
        <p class="text-sm sm:text-base text-[#94a3b8]">
          Escolha um <strong>bloco de estudos</strong> para revisar a matéria de forma direta e praticar 10 questões, ou faça o <strong>Simulado Geral</strong> com todos os 40 desafios:
        </p>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <button onclick="openStudyBlock(0)" class="text-left p-4 rounded-2xl bg-slate-900/80 border-2 border-[#38bdf8]/50 hover:border-[#38bdf8] hover:bg-[#0284c7]/20 transition cursor-pointer">
            <span class="text-xs font-bold uppercase tracking-wider text-[#38bdf8]">Bloco 1 (Tópicos 1–5)</span>
            <h2 class="text-base sm:text-lg font-bold text-[#f8f9fa] mt-0.5">Subordinadas Substantivas</h2>
            <p class="text-xs text-[#94a3b8] mt-1">Predicativa, completiva nominal, apositiva e pontuação.</p>
          </button>

          <button onclick="openStudyBlock(1)" class="text-left p-4 rounded-2xl bg-slate-900/80 border-2 border-[#38bdf8]/50 hover:border-[#38bdf8] hover:bg-[#0284c7]/20 transition cursor-pointer">
            <span class="text-xs font-bold uppercase tracking-wider text-[#38bdf8]">Bloco 2 (Tópicos 6–12)</span>
            <h2 class="text-base sm:text-lg font-bold text-[#f8f9fa] mt-0.5">Subordinadas Adjetivas</h2>
            <p class="text-xs text-[#94a3b8] mt-1">Conectivos, explicativas, reduzidas e uso da vírgula.</p>
          </button>

          <button onclick="openStudyBlock(2)" class="text-left p-4 rounded-2xl bg-slate-900/80 border-2 border-[#38bdf8]/50 hover:border-[#38bdf8] hover:bg-[#0284c7]/20 transition cursor-pointer">
            <span class="text-xs font-bold uppercase tracking-wider text-[#38bdf8]">Bloco 3 (Tópicos 13–21)</span>
            <h2 class="text-base sm:text-lg font-bold text-[#f8f9fa] mt-0.5">Subordinadas Adverbiais</h2>
            <p class="text-xs text-[#94a3b8] mt-1">Consecutiva, conformativa, concessiva, comparativa e vírgula.</p>
          </button>

          <button onclick="openStudyBlock(3)" class="text-left p-4 rounded-2xl bg-slate-900/80 border-2 border-[#38bdf8]/50 hover:border-[#38bdf8] hover:bg-[#0284c7]/20 transition cursor-pointer">
            <span class="text-xs font-bold uppercase tracking-wider text-[#38bdf8]">Bloco 4 (Tópicos 22–26)</span>
            <h2 class="text-base sm:text-lg font-bold text-[#f8f9fa] mt-0.5">Coerência e Coesão</h2>
            <p class="text-xs text-[#94a3b8] mt-1">Coerência textual, coesão referencial e coesão lexical.</p>
          </button>
        </div>
      </div>

      <div class="pt-3 border-t border-slate-700/70 flex flex-col items-center gap-2">
        <button onclick="startQuiz('all')" class="w-full sm:w-auto px-8 py-3 rounded-full font-bold text-base bg-[#0284c7] hover:bg-[#38bdf8] text-white border-2 border-white transition cursor-pointer shadow-lg">
          Fazer Simulado Geral (40 Questões) →
        </button>
      </div>
    </section>

    <!-- TELA 2: EXPLICAÇÃO DO BLOCO -->
    <section id="study-screen" class="hidden flex-1 flex flex-col justify-between gap-4">
      <div id="study-content" class="space-y-3 text-sm sm:text-base"></div>
      <div class="pt-3 border-t border-slate-700/70 flex flex-wrap items-center justify-between gap-3">
        <button onclick="backToMenu()" class="px-5 py-2.5 rounded-full font-bold bg-slate-800 hover:bg-slate-700 text-white border-2 border-white/60 transition cursor-pointer">
          ← Menu Principal
        </button>
        <button id="start-block-quiz-btn" class="px-6 py-2.5 rounded-full font-bold bg-[#0284c7] hover:bg-[#38bdf8] text-white border-2 border-white transition cursor-pointer">
          Praticar este Bloco (10 Questões) →
        </button>
      </div>
    </section>

    <!-- TELA 3: QUIZ -->
    <nav id="question-nav" class="hidden flex flex-wrap items-center justify-center gap-1 mb-4 pb-3 border-b border-slate-700/60"></nav>

    <section id="quiz-container" class="hidden flex-1 flex flex-col justify-between gap-4">
      <div id="question-area" class="space-y-4"></div>
      <div id="feedback-box" class="hidden rounded-2xl p-4 border text-sm sm:text-base leading-relaxed"></div>

      <div class="pt-2 flex flex-wrap items-center justify-between gap-3">
        <button id="prev-btn" class="px-5 py-2.5 rounded-full font-bold bg-slate-800 hover:bg-slate-700 text-white border-2 border-white/60 transition cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">
          ← Previous
        </button>
        <button id="check-btn" class="px-6 py-2.5 rounded-full font-bold bg-[#0284c7] hover:bg-[#38bdf8] text-white border-2 border-white/80 transition cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">
          Check
        </button>
        <button id="next-btn" class="px-6 py-2.5 rounded-full font-bold bg-[#0284c7] hover:bg-[#38bdf8] text-white border-2 border-white/80 transition cursor-pointer">
          Next →
        </button>
      </div>
    </section>

    <!-- TELA 4: RELATÓRIO FINAL -->
    <section id="result-screen" class="hidden flex-1 flex flex-col justify-between gap-4 py-2">
      <div class="text-center space-y-2">
        <h2 class="text-2xl sm:text-3xl font-bold text-[#38bdf8]">Relatório de Desempenho</h2>
        <div class="inline-block bg-slate-900/80 border-2 border-[#38bdf8] rounded-2xl px-8 py-4">
          <p class="text-xs uppercase tracking-wider text-[#94a3b8]">Nota Final</p>
          <p id="final-score-text" class="text-3xl sm:text-4xl font-bold text-[#f8f9fa]"></p>
        </div>
      </div>

      <div id="stats-summary" class="grid grid-cols-2 gap-3 text-center"></div>
      <div id="block-report" class="space-y-2 text-sm"></div>
      <div id="revision-alert" class="hidden rounded-2xl p-4 border border-amber-400/70 bg-amber-950/40 text-sm text-amber-100"></div>

      <div class="pt-2 flex flex-wrap justify-center gap-3">
        <button onclick="backToMenu()" class="px-6 py-2.5 rounded-full font-bold bg-slate-800 hover:bg-slate-700 text-white border-2 border-white/60 transition cursor-pointer">
          ← Menu Principal
        </button>
        <button id="restart-btn" class="px-6 py-2.5 rounded-full font-bold bg-[#0284c7] hover:bg-[#38bdf8] text-white border-2 border-white transition cursor-pointer">
          Refazer Este Quiz
        </button>
      </div>
    </section>
  </main>

  <script>
    const blocksInfo = [
      {
        id: 0,
        title: "Bloco 1: Orações Subordinadas Substantivas",
        html: `
          <h2 class="text-xl font-bold text-[#38bdf8]">Bloco 1: Orações Subordinadas Substantivas</h2>
          <p class="text-[#94a3b8]"><strong>Dica de ouro:</strong> A oração inteira funciona como um substantivo. Se você conseguir trocar a oração por <strong>"ISSO"</strong> (ou <strong>"DISSO" / "NISSO"</strong>), ela é substantiva!</p>
          <div class="bg-slate-900/70 border border-[#38bdf8]/40 rounded-2xl p-4 space-y-2.5">
            <p><strong>1. Predicativa:</strong> Vem sempre depois de um <strong>verbo de ligação</strong> (<em>ser, estar, parecer</em>) indicando uma característica ou definição do sujeito.<br><span class="text-[#38bdf8]">Ex.:</span> O importante é <strong>que todos compreendam a regra</strong>. (O importante é <em>isso</em>.)</p>
            <p><strong>2. Completiva Nominal:</strong> Completa o sentido de um <strong>nome</strong> (substantivo abstrato, adjetivo ou advérbio) e vem <strong>sempre com preposição</strong> (<em>de, em, a, com</em>).<br><span class="text-[#38bdf8]">Ex.:</span> Tenho certeza <strong>de que ele vencerá</strong>. (<em>Certeza</em> é substantivo; exige <em>de</em>.)</p>
            <p><strong>3. Apositiva:</strong> Explica ou resume um termo anterior. Geralmente vem depois de <strong>dois-pontos (:)</strong> ou entre vírgulas/travessões.<br><span class="text-[#38bdf8]">Ex.:</span> Só desejo uma coisa<strong>: que você seja feliz</strong>.</p>
            <p><strong>4. Pontuação:</strong> <strong>Nunca</strong> separe por vírgula a oração substantiva (subjetiva, objetiva ou completiva) do seu verbo ou nome principal. A exceção é a <strong>apositiva</strong>, que exige <strong>dois-pontos</strong> (ou vírgula/travessão).</p>
          </div>
        `
      },
      {
        id: 1,
        title: "Bloco 2: Orações Subordinadas Adjetivas",
        html: `
          <h2 class="text-xl font-bold text-[#38bdf8]">Bloco 2: Orações Subordinadas Adjetivas</h2>
          <p class="text-[#94a3b8]"><strong>Dica de ouro:</strong> Funcionam como um <strong>adjetivo</strong> ligado a um substantivo anterior, sendo introduzidas por um <strong>pronome relativo</strong> (<em>que, o qual, quem, cujo, onde</em>).</p>
          <div class="bg-slate-900/70 border border-[#38bdf8]/40 rounded-2xl p-4 space-y-2.5">
            <p><strong>1. Restritiva (sem vírgula):</strong> Limita, especifica um grupo dentro do todo.<br><span class="text-[#38bdf8]">Ex.:</span> Os alunos <strong>que estudaram</strong> passaram. (Apenas os que estudaram.)</p>
            <p><strong>2. Explicativa (com vírgulas):</strong> Acrescenta uma informação extra sobre o todo. <strong>Sempre isolada por vírgulas</strong> (ou travessões).<br><span class="text-[#38bdf8]">Ex.:</span> O Sol<strong>, que é uma estrela,</strong> aquece a Terra.</p>
            <p><strong>3. Conectivos:</strong> <strong>Que</strong> (coisas/pessoas), <strong>quem</strong> (pessoas com preposição), <strong>cujo(a)</strong> (ideia de posse: <em>o livro cuja capa...</em>), <strong>onde</strong> (lugar fixo).</p>
            <p><strong>4. Orações Reduzidas (sem conectivo, verbo em forma nominal):</strong><br>
            • <strong>De infinitivo:</strong> Ele foi o primeiro <strong>a chegar</strong>. (= que chegou)<br>
            • <strong>De gerúndio:</strong> Vi crianças <strong>brincando no parque</strong>. (= que brincavam)<br>
            • <strong>De particípio:</strong> Li o livro <strong>indicado pelo professor</strong>. (= que foi indicado)</p>
          </div>
        `
      },
      {
        id: 2,
        title: "Bloco 3: Orações Subordinadas Adverbiais",
        html: `
          <h2 class="text-xl font-bold text-[#38bdf8]">Bloco 3: Orações Subordinadas Adverbiais</h2>
          <p class="text-[#94a3b8]"><strong>Dica de ouro:</strong> Funcionam como um <strong>advérbio</strong>, indicando circunstância (consequência, conformidade, oposição, comparação, etc.).</p>
          <div class="bg-slate-900/70 border border-[#38bdf8]/40 rounded-2xl p-4 space-y-2.5">
            <p><strong>1. Consecutiva:</strong> Indica a <strong>consequência</strong> de algo intenso. Conectivos: <strong>tão... que, tanto... que, de modo que</strong>.<br><span class="text-[#38bdf8]">Ex.:</span> Estudou <strong>tanto que</strong> gabaritou a prova.</p>
            <p><strong>2. Conformativa:</strong> Indica <strong>acordo, regra ou modelo</strong>. Conectivos: <strong>conforme, segundo, como, consoante</strong>.<br><span class="text-[#38bdf8]">Ex.:</span> Fizemos o trabalho <strong>conforme o professor orientou</strong>.</p>
            <p><strong>3. Concessiva:</strong> Indica <strong>oposição/contraste</strong> que não impede a ação principal. Conectivos: <strong>embora, ainda que, mesmo que, apesar de que</strong>.<br><span class="text-[#38bdf8]">Ex.:</span> <strong>Embora estivesse cansado</strong>, terminou a leitura.</p>
            <p><strong>4. Comparativa:</strong> Estabelece <strong>comparação</strong>. Conectivos: <strong>mais... (do) que, tão... quanto, como</strong>.<br><span class="text-[#38bdf8]">Ex.:</span> Ele lê <strong>mais rápido do que eu (leio)</strong>.</p>
            <p><strong>5. Vírgula:</strong> Se a oração adverbial vier <strong>anteposta</strong> (no início da frase) ou <strong>intercalada</strong> (no meio), a <strong>vírgula é obrigatória</strong>!</p>
          </div>
        `
      },
      {
        id: 3,
        title: "Bloco 4: Coerência e Coesão Textual",
        html: `
          <h2 class="text-xl font-bold text-[#38bdf8]">Bloco 4: Coerência e Coesão Textual</h2>
          <p class="text-[#94a3b8]"><strong>Dica de ouro:</strong> <strong>Coerência</strong> é o sentido lógico das ideias; <strong>Coesão</strong> é a costura das palavras na superfície do texto.</p>
          <div class="bg-slate-900/70 border border-[#38bdf8]/40 rounded-2xl p-4 space-y-2.5">
            <p><strong>1. Coerência Textual:</strong> Garante que o texto faça sentido, sem contradições entre os fatos apresentados.<br><span class="text-[#38bdf8]">Ex.:</span> Dizer "estava chovendo muito, mas a rua estava seca" quebra a coerência.</p>
            <p><strong>2. Coesão Referencial:</strong> Retoma ou antecipa termos usando <strong>pronomes</strong> (<em>ele, isso, cujo</em>) ou <strong>advérbios</strong> (<em>lá, ali</em>) para evitar repetição.<br><span class="text-[#38bdf8]">Ex.:</span> Comprei um livro. <strong>Ele</strong> é ótimo.</p>
            <p><strong>3. Coesão Lexical:</strong> Conecta o texto usando palavras do mesmo campo de sentido: <strong>sinônimos</strong> (<em>casa / residência</em>), <strong>hiperônimos</strong> (<em>cachorro / animal</em>) ou <strong>expressões equivalentes</strong>.<br><span class="text-[#38bdf8]">Ex.:</span> O atleta venceu. <strong>O esportista</strong> comemorou muito.</p>
          </div>
        `
      }
    ];

    const allQuestions = [
      // ================= BLOCO 1: SUBSTANTIVAS (0 - 9) =================
      {
        block: 0,
        question: "1. Analise o período: 'A convicção da diretora era que os alunos alcançariam excelentes resultados na olimpíada.' A oração destacada 'que os alunos alcançariam excelentes resultados na olimpíada' classifica-se como:",
        options: [
          "a. Oração subordinada substantiva completiva nominal.",
          "b. Oração subordinada substantiva predicativa.",
          "c. Oração subordinada substantiva apositiva.",
          "d. Oração subordinada adjetiva explicativa.",
          "e. Oração subordinada adverbial consecutiva."
        ],
        correct: 1,
        whyCorrect: "A oração vem logo após o verbo de ligação 'era' e funciona como predicativo do sujeito 'A convicção da diretora'.",
        whyWrong: [
          "Não é completiva nominal porque não está ligada diretamente a um nome com preposição, mas sim ao verbo de ligação 'era'.",
          "",
          "Não é apositiva porque não explica um termo anterior após dois-pontos ou vírgula.",
          "Não é adjetiva porque não há pronome relativo retomando um substantivo.",
          "Não é adverbial consecutiva porque não expressa consequência de uma intensidade."
        ]
      },
      {
        block: 0,
        question: "2. No período: 'Os pesquisadores mantiveram a esperança de que a vacina fosse distribuída ainda este semestre.', a oração 'de que a vacina fosse distribuída ainda este semestre' é:",
        options: [
          "a. Oração subordinada substantiva predicativa.",
          "b. Oração subordinada adjetiva restritiva.",
          "c. Oração subordinada substantiva apositiva.",
          "d. Oração subordinada substantiva completiva nominal.",
          "e. Oração subordinada adverbial conformativa."
        ],
        correct: 3,
        whyCorrect: "A oração completa o sentido do substantivo abstrato 'esperança' e é introduzida pela preposição 'de'.",
        whyWrong: [
          "Não é predicativa porque não vem após verbo de ligação.",
          "Não é adjetiva porque 'que' é conjunção integrante (pode trocar por 'disso'), não pronome relativo.",
          "Não é apositiva porque não funciona como aposto explicativo.",
          "",
          "Não é conformativa porque não indica acordo ou regra."
        ]
      },
      {
        block: 0,
        question: "3. Leia: 'Durante a assembleia, o representante fez apenas uma exigência: que todos respeitassem o horário estabelecido.' A oração após os dois-pontos classifica-se como:",
        options: [
          "a. Oração subordinada substantiva apositiva.",
          "b. Oração subordinada substantiva predicativa.",
          "c. Oração subordinada substantiva completiva nominal.",
          "d. Oração subordinada adjetiva explicativa.",
          "e. Oração subordinada adverbial comparativa."
        ],
        correct: 0,
        whyCorrect: "A oração explica e especifica o termo anterior 'apenas uma exigência', vindo após dois-pontos.",
        whyWrong: [
          "",
          "Não é predicativa porque não há verbo de ligação ligando-a ao sujeito.",
          "Não é completiva nominal porque não completa um nome com preposição obrigatória.",
          "Não é adjetiva porque 'que' é conjunção integrante, e não pronome relativo.",
          "Não é comparativa porque não estabelece comparação entre elementos."
        ]
      },
      {
        block: 0,
        question: "4. Assinale a alternativa em que a pontuação da oração subordinada substantiva está RIGOROSAMENTE CORRETA:",
        options: [
          "a. É fundamental, que os estudantes revisem o conteúdo antes da prova.",
          "b. O médico tinha certeza, de que o tratamento funcionaria.",
          "c. Meu maior desejo é este: que você conquiste seus objetivos.",
          "d. Parecia óbvio, que a equipe venceria o campeonato.",
          "e. Todos sabiam, que o projeto exigiria muita dedicação."
        ],
        correct: 2,
        whyCorrect: "A oração substantiva apositiva exige dois-pontos antes dela ('este: que você conquiste...').",
        whyWrong: [
          "Não se usa vírgula entre o verbo de ligação ('É fundamental') e a oração subjetiva.",
          "Não se usa vírgula entre o nome ('certeza') e sua completiva nominal.",
          "",
          "Não se separa por vírgula a oração subjetiva do verbo principal ('Parecia óbvio').",
          "Não se separa por vírgula o verbo transitivo direto ('sabiam') do seu objeto direto."
        ]
      },
      {
        block: 0,

        correct: 2,

      },
      {
        block: 3,

        options: [

          "b. Coesão referencial.",
          "c. Quebra de coerência.",
          "d. Oração apositiva.",

        ],
        correct: 1,
        whyCorrect: "O pronome '-a' retoma 'bicicleta' e o advérbio 'lá' retoma 'garagem' — ambos fazem coesão referencial.",
        whyWrong: [
          "Não usam sinônimos ou hiperônimos, mas sim pronome e advérbio.",

      },
      {
        block: 3,
        question: "35. Qual alternativa apresenta um exemplo de COESÃO LEXICAL por sinonímia?",
        options: [
          "a. Vi a professora no corredor e entreguei-lhe o trabalho.",
          "b. Fui ao mercado, mas esqueci a lista lá.",
          "c. O atleta cruzou a linha de chegada. O esportista comemorou a vitória.",
          "d. Embora estivesse cansado, ele continuou.",
          "e. O importante é que todos participem."
        ],
        correct: 2,
        whyCorrect: "'O esportista' retoma 'O atleta' por meio de um sinônimo/expressão equivalente, caracterizando coesão lexical.",
        whyWrong: [
          "Usa o pronome 'lhe' (coesão referencial).",
          "Usa o advérbio 'lá' (coesão referencial).",
          "",

          "É uma oração substantiva predicativa."
        ]
      },
      {

        options: [
          "a. Apenas do uso correto das vírgulas.",
          "b. Da relação lógica e da ausência de contradições entre as ideias do texto.",
          "c. Da repetição constante das mesmas palavras.",
          "d. Do uso exclusivo de orações reduzidas.",

        ],
        correct: 1,

          "",

          "Quantidade de adjetivos não define coerência."

      },
      {

          "b. Quebra de coerência.",

          "e. Oração substantiva completiva nominal."
        ],

        whyCorrect: "O pronome demonstrativo 'Esse' aponta para o que já foi dito ('venceu o torneio'), fazendo coesão referencial.",

        ]
      },
      {
        block: 3,
        question: "38. Leia: 'As florestas tropicais abrigam milhares de espécies. Esses ecossistemas precisam de proteção.' O termo 'ecossistemas' estabelece:",
        options: [
          "a. Coesão lexical, substituindo 'florestas tropicais' por um termo mais abrangente.",
          "b. Incoerência textual.",

          "e. Erro de pontuação."
        ],
        correct: 0,
        whyCorrect: "'Ecossistemas' é um hiperônimo que retoma 'florestas tropicais' no campo do léxico.",
        whyWrong: [

          "Não há comparação.",
          "Não há verbo de ligação com oração predicativa.",
          "A pontuação está correta."
        ]
      },
      {
        block: 3,
        question: "39. Qual é a principal função da coesão textual?",
        options: [
          "a. Aumentar o número de páginas de um texto.",
          "b. Ligar palavras, frases e parágrafos, evitando repetições desnecessárias e facilitando a leitura.",
          "c. Substituir todos os verbos por substantivos.",
          "d. Eliminar todas as vírgulas do texto.",
          "e. Criar contradições entre os parágrafos."
        ],
        correct: 1,
        whyCorrect: "A coesão é a 'costura' do texto, conectando seus elementos para dar fluidez e evitar repetições.",
        whyWrong: [
          "Não tem relação com o tamanho do texto.",
          "",
          "Verbos são essenciais na maioria das orações.",
          "Vírgulas são fundamentais para a coesão e clareza.",

      },
      {
        block: 3,
        question: "40. 'A cidade de Aracaju possui belas praias. A capital sergipana atrai muitos turistas.' A expressão 'A capital sergipana' é um exemplo de:",
        options: [
          "a. Oração adverbial concessiva.",
          "b. Coesão referencial por advérbio.",
          "c. Quebra de coerência.",
          "d. Coesão lexical por expressão equivalente.",
          "e. Oração adjetiva reduzida de infinitivo."
        ],
        correct: 3,
        whyCorrect: "'A capital sergipana' retoma 'A cidade de Aracaju' usando uma expressão lexical equivalente.",
        whyWrong: [
          "Não há conjunção concessiva.",
          "Não é advérbio, mas sim uma expressão nominal equivalente.",
          "O texto é totalmente coerente.",
          "",
          "Não há verbo no infinitivo."
        ]
      }
    ];

    let activeQuestions = [];
    let currentMode = "all";
    let currentIndex = 0;
    let userSelections = [];
    let checkedQuestions = [];

    const menuScreen = document.getElementById("menu-screen");
    const studyScreen = document.getElementById("study-screen");
    const studyContent = document.getElementById("study-content");
    const startBlockQuizBtn = document.getElementById("start-block-quiz-btn");
    const headerSubtitle = document.getElementById("header-subtitle");
    const quizBadges = document.getElementById("quiz-badges");
    const progressBadge = document.getElementById("progress-badge");
    const scoreBadge = document.getElementById("score-badge");
    const questionNav = document.getElementById("question-nav");
    const quizContainer = document.getElementById("quiz-container");
    const questionArea = document.getElementById("question-area");
    const feedbackBox = document.getElementById("feedback-box");
    const prevBtn = document.getElementById("prev-btn");
    const checkBtn = document.getElementById("check-btn");
    const nextBtn = document.getElementById("next-btn");
    const resultScreen = document.getElementById("result-screen");
    const finalScoreText = document.getElementById("final-score-text");
    const statsSummary = document.getElementById("stats-summary");
    const blockReport = document.getElementById("block-report");
    const revisionAlert = document.getElementById("revision-alert");
    const restartBtn = document.getElementById("restart-btn");

    function hideAllScreens() {
      menuScreen.classList.add("hidden");
      studyScreen.classList.add("hidden");
      questionNav.classList.add("hidden");
      quizContainer.classList.add("hidden");
      resultScreen.classList.add("hidden");
      quizBadges.classList.add("hidden");
    }

    window.backToMenu = function () {
      hideAllScreens();
      headerSubtitle.textContent = "Guia Prático e Simulado Avaliativo";
      menuScreen.classList.remove("hidden");
    };

    window.openStudyBlock = function (blockId) {
      hideAllScreens();
      headerSubtitle.textContent = blocksInfo[blockId].title;
      studyContent.innerHTML = blocksInfo[blockId].html;
      startBlockQuizBtn.onclick = () => startQuiz(blockId);
      studyScreen.classList.remove("hidden");
    };

    window.startQuiz = function (mode) {
      currentMode = mode;
      activeQuestions = mode === "all"
        ? allQuestions
        : allQuestions.filter(q => q.block === mode);

      currentIndex = 0;
      userSelections = Array(activeQuestions.length).fill(null);
      checkedQuestions = Array(activeQuestions.length).fill(false);

      hideAllScreens();
      headerSubtitle.textContent = mode === "all"
        ? "Simulado Geral (40 Questões)"
        : blocksInfo[mode].title;
      quizBadges.classList.remove("hidden");
      questionNav.classList.remove("hidden");
      quizContainer.classList.remove("hidden");
      renderQuestion();
    };

    function calculateScore() {
      let correctCount = 0;
      for (let i = 0; i < activeQuestions.length; i++) {
        if (checkedQuestions[i] && userSelections[i] === activeQuestions[i].correct) {
          correctCount++;
        }
      }
      return (correctCount / activeQuestions.length) * 10;
    }

    function updateScoreBadge() {
      scoreBadge.textContent = `Nota: ${calculateScore().toFixed(1)} / 10`;
    }

    function renderNav() {
      questionNav.innerHTML = "";
      activeQuestions.forEach((_, idx) => {
        const btn = document.createElement("button");
        btn.textContent = idx + 1;
        btn.onclick = () => {
          currentIndex = idx;
          renderQuestion();
        };

        let classes = "w-6 h-6 rounded-full text-[11px] font-bold border transition cursor-pointer flex items-center justify-center ";
        if (idx === currentIndex) {
          classes += "bg-[#38bdf8] text-slate-950 border-white scale-110 shadow ";
        } else if (checkedQuestions[idx]) {
          classes += userSelections[idx] === activeQuestions[idx].correct
            ? "bg-emerald-500/30 text-emerald-200 border-emerald-400 "
            : "bg-rose-500/30 text-rose-200 border-rose-400 ";
        } else if (userSelections[idx] !== null) {
          classes += "bg-[#0284c7]/40 text-white border-[#38bdf8] ";
        } else {
          classes += "bg-slate-800/80 text-[#94a3b8] border-slate-600 hover:border-[#38bdf8] hover:text-white ";
        }
        btn.className = classes;
        questionNav.appendChild(btn);
      });
    }

    function renderQuestion() {
      const q = activeQuestions[currentIndex];
      const selectedIdx = userSelections[currentIndex];
      const isChecked = checkedQuestions[currentIndex];

      progressBadge.textContent = `${currentIndex + 1} / ${activeQuestions.length}`;
      prevBtn.disabled = currentIndex === 0;
      checkBtn.disabled = isChecked || selectedIdx === null;
      nextBtn.textContent = currentIndex === activeQuestions.length - 1 ? "Finalizar →" : "Next →";

      renderNav();

      let html = `<h2 class="text-base sm:text-lg font-bold text-[#f8f9fa] leading-snug">${q.question}</h2><div class="space-y-2.5">`;
      q.options.forEach((opt, idx) => {
        let btnClasses = "option-btn w-full text-left px-4 py-3 rounded-full border-2 text-sm sm:text-base text-[#f8f9fa] ";
        if (isChecked) {
          if (idx === q.correct) {
            btnClasses += "border-emerald-400 bg-emerald-500/20 font-bold ";
          } else if (idx === selectedIdx && idx !== q.correct) {
            btnClasses += "border-rose-400 bg-rose-500/20 ";
          } else {
            btnClasses += "border-white/20 bg-slate-800/50 opacity-60 ";
          }
        } else {
          btnClasses += idx === selectedIdx
            ? "border-[#38bdf8] bg-[#0284c7]/30 font-semibold cursor-pointer "
            : "border-white/40 bg-slate-800/80 cursor-pointer ";
        }
        html += `<button onclick="selectOption(${idx})" ${isChecked ? "disabled" : ""} class="${btnClasses}">${opt}</button>`;
      });
      html += `</div>`;
      questionArea.innerHTML = html;

      if (isChecked) {
        const isCorrect = selectedIdx === q.correct;
        if (isCorrect) {
          feedbackBox.className = "rounded-2xl p-4 border border-emerald-400/60 bg-emerald-950/50 text-sm sm:text-base leading-relaxed text-[#f8f9fa]";
          feedbackBox.innerHTML = `<strong>Acertou!</strong> ${q.whyCorrect}`;
        } else {
          feedbackBox.className = "rounded-2xl p-4 border border-rose-400/60 bg-rose-950/50 text-sm sm:text-base leading-relaxed text-[#f8f9fa] space-y-2";
          feedbackBox.innerHTML = `
            <p><strong class="text-rose-300">Por que a sua escolha está errada:</strong> ${q.whyWrong[selectedIdx]}</p>
            <p><strong class="text-emerald-300">Por que a correta é a letra ${String.fromCharCode(97 + q.correct)}:</strong> ${q.whyCorrect}</p>
          `;
        }
        feedbackBox.classList.remove("hidden");
      } else {
        feedbackBox.classList.add("hidden");
      }

      updateScoreBadge();
    }

    window.selectOption = function (idx) {
      if (checkedQuestions[currentIndex]) return;
      userSelections[currentIndex] = idx;
      renderQuestion();
    };

    checkBtn.addEventListener("click", () => {
      if (userSelections[currentIndex] === null || checkedQuestions[currentIndex]) return;
      checkedQuestions[currentIndex] = true;
      renderQuestion();
    });

    prevBtn.addEventListener("click", () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    });

    nextBtn.addEventListener("click", () => {
      if (currentIndex < activeQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        showResults();
      }
    });

    function showResults() {
      hideAllScreens();
      resultScreen.classList.remove("hidden");

      const total = activeQuestions.length;
      let hits = 0;
      const blockStats = {};

      activeQuestions.forEach((q, idx) => {
        if (!blockStats[q.block]) blockStats[q.block] = { total: 0, hits: 0, errors: 0 };
        blockStats[q.block].total++;
        if (checkedQuestions[idx] && userSelections[idx] === q.correct) {
          hits++;
          blockStats[q.block].hits++;
        } else {
          blockStats[q.block].errors++;
        }
      });

      const errors = total - hits;
      const hitPct = Math.round((hits / total) * 100);
      const errPct = 100 - hitPct;
      const finalGrade = (hits / total) * 10;

      finalScoreText.textContent = `${finalGrade.toFixed(1)} / 10.0`;
      statsSummary.innerHTML = `
        <div class="bg-emerald-950/40 border border-emerald-400/50 rounded-2xl p-3">
          <p class="text-xs text-emerald-300 font-bold uppercase">Acertos</p>
          <p class="text-xl font-bold text-white">${hits} (${hitPct}%)</p>
        </div>
        <div class="bg-rose-950/40 border border-rose-400/50 rounded-2xl p-3">
          <p class="text-xs text-rose-300 font-bold uppercase">Erros</p>
          <p class="text-xl font-bold text-white">${errors} (${errPct}%)</p>
        </div>
      `;

      const blocksToReview = [];
      let reportHtml = `<p class="text-xs font-bold uppercase tracking-wider text-[#38bdf8] mb-1">Desempenho por Bloco:</p>`;
      Object.keys(blockStats).forEach(bId => {
        const st = blockStats[bId];
        const bErrPct = Math.round((st.errors / st.total) * 100);
        if (bErrPct >= 30) blocksToReview.push(blocksInfo[bId].title);
        reportHtml += `
          <div class="flex items-center justify-between bg-slate-900/70 border border-slate-700 rounded-xl px-3 py-2">
            <span class="font-semibold text-[#f8f9fa]">${blocksInfo[bId].title}</span>
            <span class="text-xs font-bold ${bErrPct >= 30 ? 'text-amber-300' : 'text-emerald-300'}">
              ${st.hits}/${st.total} acertos (${bErrPct}% erros)
            </span>
          </div>
        `;
      });
      blockReport.innerHTML = reportHtml;

      if (blocksToReview.length > 0) {
        revisionAlert.innerHTML = `<strong>Atenção — Foco na Revisão:</strong> Você teve uma quantidade relevante de erros em: <strong>${blocksToReview.join(", ")}</strong>. Vale a pena voltar ao menu principal e revisar esses blocos!`;
        revisionAlert.classList.remove("hidden");
      } else {
        revisionAlert.classList.add("hidden");
      }
    }

    restartBtn.addEventListener("click", () => startQuiz(currentMode));
  </script>
</body>
</html>
